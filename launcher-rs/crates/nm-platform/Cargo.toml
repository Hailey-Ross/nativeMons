[package]
name = "nm-platform"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The launcher's platform layer: SDL3 window and input (feature sdl), single instance, requests, Light mode detection."

[features]
default = []
# The SDL3 window, built from source (needs CMake and a C compiler).
sdl = ["dep:sdl3-sys"]

[dependencies]
nm-core = { path = "../nm-core" }
sdl3-sys = { version = "=0.7.1", features = ["build-from-source-static"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.52.0", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
x11rb = { version = "0.13", default-features = false }

[dev-dependencies]
# The X11 module is type-checked and tested on Windows too.
x11rb = { version = "0.13", default-features = false }
