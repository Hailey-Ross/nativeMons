name: Zakuro findings
description: Share where Zakuro had to interpret a 3DS game's code. Once checked, it goes into the shared lists every launcher downloads, so everyone's 3DSrecomp+Zakuro builds cover it.
title: "Zakuro hints: "
labels: ["zakuro-hints"]
body:
  - type: markdown
    attributes:
      value: |
        The launcher's **Share Zakuro findings** filled in the game and its code version, and showed you the file.
        It holds addresses only (numbers like `0010022D`): no game code, saves or anything about you.
  - type: input
    id: game
    attributes:
      label: Game
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: Code version
      description: "<title id>-<code hash>, the file's name without .hints"
      placeholder: 0004000000164800-0123456789ABCDEF
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: The .hints file
      description: Paste the list the launcher put on your clipboard (Ctrl+V), or drag in the .txt file it showed you.
    validations:
      required: true
  - type: checkboxes
    id: ok
    attributes:
      label: Sharing
      options:
        - label: These addresses may go into nativeMons' shared lists.
          required: true
