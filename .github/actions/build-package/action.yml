name: Build the package
description: Builds the launcher and mon-bridge, stages the engines into dist\nativeMons, and checks the result.

inputs:
  github-token:
    description: Token for downloading Fulldex's release
    required: true

runs:
  using: composite
  steps:
    - name: Check that no removed launcher files came back
      shell: bash
      run: sh engines/gen1recomp/tools/nativemons/check-removed.sh

    - name: Build the launcher
      shell: cmd
      run: launcher\build.bat "%GITHUB_WORKSPACE%\dist\nativeMons"

    - name: Stage the engines
      shell: pwsh
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        LOVE_VERSION: "11.5"
        FULLDEX_RELEASE: "fulldex-2026-11-08"
        PLATINUM_RELEASE: "v0.2.1"
        NATIVEPLAT_RELEASE: "windows-095b8f537"
      run: |
        $dist = "dist\nativeMons"
        Copy-Item LICENSE, README.md $dist

        # Gen1Recomp: what the game needs at run time, with its licence.
        $gen1 = "$dist\engines\gen1recomp"
        New-Item -ItemType Directory -Force $gen1 | Out-Null
        $skip = '.git', '.github', 'docs', 'test', 'tests', 'mobile', 'ports', 'flatpak', 'scripts'
        Get-ChildItem engines\gen1recomp -Force | Where-Object { $skip -notcontains $_.Name } | Copy-Item -Destination $gen1 -Recurse

        # LOVE, which runs Gen1Recomp.
        Invoke-WebRequest "https://github.com/love2d/love/releases/download/$env:LOVE_VERSION/love-$env:LOVE_VERSION-win64.zip" -OutFile love.zip
        Expand-Archive love.zip love-unpacked
        Move-Item "love-unpacked\love-$env:LOVE_VERSION-win64" "$dist\love"

        # Fulldex: its own published Windows build, unmodified.
        gh release download $env:FULLDEX_RELEASE -R mamesj/pokemon-fulldex -p "pokemon-ds-wide-pc-windows-x86_64.zip" -O fulldex.zip
        Expand-Archive fulldex.zip fulldex-unpacked
        Move-Item "fulldex-unpacked\pokemon-ds-wide" "$dist\engines\fulldex"

        # The Platinum PC port: the program only, no game data. Those come from the player's ROM.
        gh release download $env:PLATINUM_RELEASE -R cybervisi0n/pokeplatinum -p "release_win64.zip" -O pokeplatinum.zip
        Expand-Archive pokeplatinum.zip "$dist\engines\pokeplatinum"
        Copy-Item launcher\LICENSE-libntr.txt "$dist\engines\pokeplatinum"
        # nativeplat: the program only, built by our fork's public workflow. Its data goes in userdata beside it.
        gh release download $env:NATIVEPLAT_RELEASE -R Hailey-Ross/gen4recomp -p "nativeplat-windows-x64.zip" -O nativeplat.zip
        Expand-Archive nativeplat.zip nativeplat-unpacked
        Move-Item nativeplat-unpacked\nativeplat-windows-x64 "$dist\engines\nativeplat"
        Set-Content "$dist\engines\nativeplat\portable.txt" ''

        # mGBA's libretro core, for romhacks' title screens, with its licence.
        New-Item -ItemType Directory -Force "$dist\tools\mgba" | Out-Null
        Invoke-WebRequest "https://buildbot.libretro.com/nightly/windows/x86_64/latest/mgba_libretro.dll.zip" -OutFile mgba.zip
        Expand-Archive mgba.zip "$dist\tools\mgba"
        Invoke-WebRequest "https://raw.githubusercontent.com/mgba-emu/mgba/master/LICENSE" -OutFile "$dist\tools\mgba\LICENSE-mGBA.txt"

        # hails.nds-Patcher.
        New-Item -ItemType Directory -Force "$dist\tools\nds-patcher" | Out-Null
        Copy-Item tools\nds-patcher\*.py, tools\nds-patcher\LICENSE "$dist\tools\nds-patcher"

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: "10.0.x"

    - name: Build mon-bridge
      shell: pwsh
      run: dotnet publish tools\mon-bridge\MonBridge.csproj -c Release -o dist\nativeMons\tools\mon-bridge

    - name: Build the OpenHome converter
      shell: pwsh
      run: tools\openhome-bridge\build.ps1 -Out dist\nativeMons\tools\openhome -Work openhome-work

    # Our GBA player: the Fulldex fork's gba-wide folder (mGBA fetched at its pinned commit and patched there).
    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: false
        install: >-
          git
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-SDL2

    - name: Build the GBA player
      shell: msys2 {0}
      run: |
        set -e
        cmake -S engines/fulldex/gba-wide -B gbawide-build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build gbawide-build --parallel 4
        gba=dist/nativeMons/engines/gbawide
        mkdir -p "$gba"
        cp gbawide-build/gbawide.exe "$gba/"
        cp engines/fulldex/gba-wide/README.md "$gba/README.md"
        cp engines/fulldex/LICENSE "$gba/LICENSE.txt"
        curl -fsSL https://raw.githubusercontent.com/mgba-emu/mgba/master/LICENSE -o "$gba/LICENSE-mGBA.txt"
        cp engines/fulldex/frontend/thirdparty/rcheevos/LICENSE "$gba/LICENSE-rcheevos.txt"
        cp engines/fulldex/gba-wide/third_party/pokedaisy/NOTICE "$gba/NOTICE-PokeDaisy.txt"
        cp engines/fulldex/gba-wide/third_party/pokedaisy/LICENSE "$gba/LICENSE-PokeDaisy.txt"

    - name: Check the package
      shell: pwsh
      run: |
        $bad = Get-ChildItem dist -Recurse -File | Where-Object { $_.Extension -in '.gb', '.gbc', '.gba', '.nds', '.sav' -or $_.Name -eq 'key1.bin' }
        if ($bad) { $bad.FullName; throw "Game data in the package" }
        foreach ($p in 'assets\launcher', 'assets\labels', 'src\import\LauncherView.lua', 'src\import\RomImporter.lua', 'src\mods\LauncherMods.lua') {
          if (Test-Path "dist\nativeMons\engines\gen1recomp\$p") { throw "Removed launcher file in the package: $p" }
        }
        foreach ($p in 'tools\mgba\mgba_libretro.dll', 'tools\mgba\LICENSE-mGBA.txt', 'tools\openhome\convert.cjs', 'tools\openhome\pkm_rs_bg.wasm', 'tools\openhome\node.exe', 'engines\pokeplatinum\main.exe', 'engines\nativeplat\nativeplat.exe', 'engines\gbawide\gbawide.exe') {
          if (-not (Test-Path "dist\nativeMons\$p")) { throw "Missing from the package: $p" }
        }
