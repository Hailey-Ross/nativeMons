name: Publish a rolling release
description: Packages dist\nativeMons and replaces a rolling release, with its notes from .github/release-notes.md.

inputs:
  tag:
    description: The rolling tag, which is also the channel name
    required: true
  banner:
    description: The line under the download link
    required: true
  prerelease:
    description: "true for a prerelease"
    required: true
  github-token:
    description: Token for publishing
    required: true

runs:
  using: composite
  steps:
    - shell: pwsh
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ inputs.tag }}
        BANNER: ${{ inputs.banner }}
        PRE: ${{ inputs.prerelease }}
        BUILD: ${{ github.run_number }}
        REPO: ${{ github.repository }}
      run: |
        $sha = "${{ github.sha }}"
        $zip = "nativeMons-windows-x64.zip"

        # Stable carries the number in VERSION. Dev carries the last stable version it came after, if any.
        $stable = $env:PRE -ne "true"
        $version = if ($stable) { (Get-Content VERSION -Raw).Trim() } else {
          @(git ls-remote --tags origin "refs/tags/v*" | ForEach-Object { ($_ -split 'refs/tags/v')[1] } | Where-Object { $_ -match '^\d+\.\d+\.\d+$' } | Sort-Object { [version]$_ }) | Select-Object -Last 1
        }
        # The launcher's updater compares this with the channel's release.json.
        "channel=$env:TAG`nbuild=$env:BUILD`nrevision=$sha`nversion=$version" | Out-File -Encoding ascii dist\nativeMons\version.txt
        Compress-Archive dist\nativeMons $zip
        $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
        "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256" -NoNewline
        @{ channel = $env:TAG; build = [int]$env:BUILD; revision = $sha; version = "$version"; package = $zip; sha256 = $hash } | ConvertTo-Json | Out-File -Encoding ascii release.json

        $commits = git log -15 --no-merges --format="- ``%h`` %s" $sha
        # A build made by the Engine sync workflow says so, with what moved upstream.
        $title = if ($stable) { "nativeMons $version" } else { "nativeMons ($env:TAG)" }; $sync = @()
        if ((git log -1 --format=%s $sha) -eq 'Engine auto-sync with upstream') {
          $title += ": engine auto-sync with upstream"
          $sync = @("**Engine auto-sync with upstream.** Built automatically from these upstream updates:", "", (git log -1 --format=%b $sha).Trim(), "")
        }
        # A stable release's own section of CHANGELOG.md.
        $changes = @()
        if ($stable) {
          $in = $false
          $section = foreach ($l in Get-Content CHANGELOG.md -Encoding utf8) { if ($l -match '^## ') { $in = $l.Trim() -eq "## $version"; continue }; if ($in) { $l } }
          $changes = @("## What's new in $version", "", ($section -join "`n").Trim(), "")
        }
        $first = if ($stable) { "Version **$version**, build **$env:BUILD**" } elseif ($version) { "Rolling build **$env:BUILD**, after version $version" } else { "Rolling build **$env:BUILD**" }
        $notes = @(
          "$first, commit ``$($sha.Substring(0, 12))``."
          ""
          $sync
          $changes
          "[Download Windows ZIP](https://github.com/$env:REPO/releases/download/$env:TAG/$zip)"
          ""
          "> $env:BANNER"
          ""
          (Get-Content .github\release-notes.md -Raw -Encoding utf8).Trim()
          ""
          "## Recent commits"
          ""
          ($commits -join "`n")
        ) -join "`n"
        [IO.File]::WriteAllText("$PWD\release-body.md", $notes, (New-Object Text.UTF8Encoding($false)))

        gh release delete $env:TAG --cleanup-tag --yes 2>$null
        $global:LASTEXITCODE = 0
        $flag = if ($env:PRE -eq "true") { "--prerelease" } else { "--latest" }
        gh release create $env:TAG $zip "$zip.sha256" release.json --target $sha --title $title --notes-file release-body.md $flag
        # A raised VERSION also stays for good as vX.Y.Z; a stable build that keeps the number only refreshes stable.
        if ($stable -and -not (git ls-remote --tags origin "refs/tags/v$version")) {
          [IO.File]::WriteAllText("$PWD\release-body.md", $notes.Replace("/download/$env:TAG/", "/download/v$version/"), (New-Object Text.UTF8Encoding($false)))
          gh release create "v$version" $zip "$zip.sha256" release.json --target $sha --title $title --notes-file release-body.md --latest=false
        }
