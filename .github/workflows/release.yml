# Every push to main replaces the stable release and adds a numbered one from VERSION.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 30

      # A stable release needs a new number in VERSION and its section in CHANGELOG.md.
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION should be like 0.0.5, not '$v'." }
          if (git ls-remote --tags origin "refs/tags/v$v") { throw "v$v is already released. Raise VERSION for this release." }
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## $([regex]::Escape($v))\s*$" -Quiet)) { throw "CHANGELOG.md has no '## $v' section." }

      - uses: ./.github/actions/build-package
        with:
          github-token: ${{ github.token }}

      - uses: ./.github/actions/publish-release
        with:
          tag: stable
          prerelease: "false"
          banner: "**STABLE, rolling build.** The latest working build, from the `main` branch. Please report bugs. For the newest features, try [bleeding edge](https://github.com/Hailey-Ross/nativeMons/releases/tag/bleeding-edge)."
          github-token: ${{ github.token }}
