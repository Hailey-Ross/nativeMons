# Every push to main replaces the stable release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/build-package
        with:
          github-token: ${{ github.token }}

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $short = "${{ github.sha }}".Substring(0, 7)
          $zip = "nativeMons-stable-windows-x64.zip"
          $note = "The latest working build, from the main branch. Built from commit ${{ github.sha }}.`n`nNo games are included: you need your own ROMs. See the README for credits and licences."
          Compress-Archive dist\nativeMons $zip
          gh release delete stable --cleanup-tag --yes 2>$null
          $global:LASTEXITCODE = 0
          gh release create stable $zip --target "${{ github.sha }}" --title "Stable (working build, $short)" --notes $note --latest
