# Every push to main replaces the stable release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 30

      - uses: ./.github/actions/build-package
        with:
          github-token: ${{ github.token }}

      - uses: ./.github/actions/publish-release
        with:
          tag: stable
          prerelease: "false"
          banner: "**STABLE, rolling build.** The latest working build, from the `main` branch. Please report bugs. For the newest features, try [bleeding edge](https://github.com/Hailey-Ross/nativeMons/releases/tag/bleeding-edge)."
          github-token: ${{ github.token }}
