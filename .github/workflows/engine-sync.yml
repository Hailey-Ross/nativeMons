# Twice a day: upstream engine updates into the forks, and their pins onto dev (notes/engine-sync.md).
name: Engine sync

on:
  schedule:
    - cron: "0 7 * * *"   # midnight MST
    - cron: "0 19 * * *"  # noon MST (GitHub may start scheduled runs late)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # gen4recomp's build, then Azahar's and AzaharPlus's, waited for in turn
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ vars.ENGINE_SYNC_APP_ID }}
          private-key: ${{ secrets.ENGINE_SYNC_APP_KEY }}
          owner: Hailey-Ross
          repositories: nativeMons,gen1recomp,pokemon-fulldex,gen4recomp,azahar,AzaharPlus,pokeplatinum,3dsrecomp,zakuro,PKHeX,OpenHome

      - uses: actions/checkout@v7
        with:
          ref: dev
          token: ${{ steps.app.outputs.token }}

      - name: Sync
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          export BOT_NAME="$SLUG[bot]"
          export BOT_EMAIL="$(gh api "/users/$SLUG%5Bbot%5D" --jq .id)+$SLUG[bot]@users.noreply.github.com"
          bash .github/engine-sync/sync.sh
