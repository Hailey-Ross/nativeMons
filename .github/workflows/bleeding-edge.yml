# Every push to dev replaces the bleeding-edge prerelease.
name: Bleeding Edge

on:
  push:
    branches: [dev]

permissions:
  contents: write

concurrency:
  group: bleeding-edge
  cancel-in-progress: true

jobs:
  bleeding-edge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 30

      - uses: ./.github/actions/build-package
        with:
          github-token: ${{ github.token }}

      - uses: ./.github/actions/publish-release
        with:
          tag: bleeding-edge
          prerelease: "true"
          banner: "**BLEEDING EDGE, rolling build.** Built from every commit to the `dev` branch, so it may be broken. Back up your saves, and please report bugs. For the latest working build, use [stable](https://github.com/Hailey-Ross/nativeMons/releases/tag/stable)."
          github-token: ${{ github.token }}
